apiVersion: apps/v1
kind: Deployment
metadata:
  name:  flask-backend
  labels:
    desc:  ares-app-deployment
spec:
  selector:
    matchLabels:
      app: flask-backend
  replicas: 2
  template:
    metadata:
      labels:
        app:  flask-backend
    spec:
      containers:
      - name:  flask-backend
        image:  docker.io/tanmaga13/ares-backend:v1
        ports:
        - containerPort:  8000